<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华文智能互动学习阅读器 - 宣纸克莱因灰蓝版</title>
    <style>
        /* ==========================================================================
           📜 宣纸底色 × 克莱因灰蓝学术风配色系统 (Xuan Paper & Klein Slate-Blue Theme)
           ========================================================================== */

        :root {
            /* 📜 日间模式：古籍宣纸微黄底色，护眼温润 */
            --bg-color: #f7f4eb;
            --bg-gradient: radial-gradient(circle at top right, #faf8f2 0%, #ede6d6 100%);
            --text-color: #1c1c1c;         /* 浓墨炭黑，清晰锐利 */
            --text-muted: #5c554b;         /* 淡墨辅助字 */
            --card-bg: #fffcf7;          /* 仿宣纸白卡片 */
            
            /* 🔷 核心主色调：克莱因灰蓝（按钮, 核心强调, 选中态, 边框） */
            --primary-color: #334155;
            --primary-hover: #1e293b;

            /* 🔲 生词本专用色：灰蓝底深灰字 */
            --notebook-color: #334155;
            --notebook-bg: #e2e8f0;

            /* 🖋️ 文本赏析专用色：高级灰蓝渐进色系 */
            --ai-color: #475569;
            --ai-bg: #f1f5f9;

            /* 🔷 正确/成功提示色：克莱因灰蓝 */
            --accent-color: #334155;
            --accent-bg: #e2e8f0;

            --ruby-color: #64748b;         /* 拼音：克制冷灰, 优雅理性 */
            --input-border: #cbd5e1;       /* 质感灰边框 */
            --shadow-sm: 0 4px 6px -1px rgba(51, 65, 85, 0.05), 0 2px 4px -1px rgba(51, 65, 85, 0.02);
            --shadow-md: 0 15px 30px -5px rgba(51, 65, 85, 0.08), 0 8px 10px -6px rgba(51, 65, 85, 0.03);
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        /* 🌙 暗黑模式：深夜高级钛灰蓝版 */
        [data-theme="dark"] {
            --bg-color: #0b0f17;
            --bg-gradient: radial-gradient(circle at top right, #151c28 0%, #0b0f17 100%);
            --text-color: #f1f5f9;         /* 亮白灰 */
            --text-muted: #94a3b8;
            --card-bg: #111827;            /* 深空钛灰卡片底 */
            
            --primary-color: #94a3b8;      /* 柔和克制灰蓝 */
            --primary-hover: #cbd5e1;
            
            --notebook-color: #cbd5e1;
            --notebook-bg: rgba(148, 163, 184, 0.12);

            --ai-color: #cbd5e1;       /* 亮灰蓝 */
            --ai-bg: #1e293b;          /* 深空灰幽底 */

            --accent-color: #cbd5e1;
            --accent-bg: rgba(148, 163, 184, 0.15);
            --ruby-color: #94a3b8;
            --input-border: #334155;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 15px 30px -5px rgba(0, 0, 0, 0.6);
        }

        /* 🌟 极简纤细优雅滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 2.1;
            margin: 0;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* 顶栏与生词本容器 */
        .top-container {
            width: 100%;
            max-width: 1400px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .control-panel {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .control-panel button {
            padding: 10px 20px;
            border: 1px solid var(--input-border);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }

        .control-panel button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* 生词本美化 */
        .vocab-notebook {
            width: 100%;
            background: var(--card-bg);
            padding: 20px 26px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            box-sizing: border-box;
            border: 1px solid var(--input-border);
            transition: all 0.3s ease;
        }

        .notebook-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 15px;
            margin-bottom: 12px;
            color: var(--text-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .notebook-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .export-nb-btn {
            background: var(--notebook-bg);
            color: var(--notebook-color);
            border: 1px solid var(--input-border);
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s;
        }
        .export-nb-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .clear-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: opacity 0.2s;
        }
        .clear-btn:hover { opacity: 0.9; }

        .notebook-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .notebook-item {
            background: var(--notebook-bg);
            color: var(--notebook-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid rgba(51, 65, 85, 0.2);
            transition: all 0.2s;
        }

        .notebook-item:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-1px);
        }

        /* 🖥️ 左右双栏核心工作区 */
        .workspace-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            width: 100%;
            max-width: 1400px;
            align-items: start;
            transition: all 0.3s ease;
        }

        /* 生词测试弹窗区 */
        .game-container {
            width: 100%;
            max-width: 1400px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 25px;
            box-sizing: border-box;
            border: 1px solid var(--input-border);
        }

        .quiz-card { text-align: center; padding: 10px 0; }
        .quiz-pinyin { font-size: 16px; color: var(--text-muted); margin-bottom: 25px; font-weight: 600; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .quiz-opt-btn {
            padding: 14px 20px;
            background: var(--card-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .quiz-opt-btn:hover {
            background: var(--accent-bg) !important;
            border-color: var(--primary-color) !important;
            color: var(--primary-color) !important;
        }
        .quiz-opt-btn.correct { background: var(--primary-color) !important; color: white !important; border-color: var(--primary-color); }
        .quiz-opt-btn.wrong { background: #64748b !important; color: white !important; border-color: #64748b; cursor: not-allowed; }

        #quizQuestion {
            font-size: 40px;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: 2px;
        }

        /* 左侧课文卡片 */
        .article-card {
            width: 100%;
            background: var(--card-bg);
            padding: 45px 50px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            box-sizing: border-box;
            border: 1px solid var(--input-border);
            max-height: 82vh;
            overflow-y: auto;
            transition: max-height 0.3s ease;
        }

        /* 右侧题目卡片 */
        .quiz-side-card {
            width: 100%;
            background: var(--card-bg);
            padding: 45px 50px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            box-sizing: border-box;
            border: 1px solid var(--input-border);
            max-height: 82vh;
            overflow-y: auto;
            display: none;
            transition: max-height 0.3s ease;
        }

        h1 { text-align: center; font-size: 32px; font-weight: 800; margin-top: 0; margin-bottom: 35px; letter-spacing: 2px; font-family: "KaiTi", "STKaiti", serif; }
        #content p { text-align: justify; text-justify: inter-ideograph; margin-bottom: 35px; font-size: 19.5px; letter-spacing: 1.8px; }

        .p-index {
            display: inline-block;
            font-size: 12px;
            background: var(--notebook-bg);
            color: var(--notebook-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            user-select: none;
            margin-right: 6px;
            border: 1px solid var(--input-border);
        }

        ruby { ruby-position: over; cursor: pointer; padding: 0 2px; border-radius: 4px; transition: all 0.2s ease; }
        ruby:hover, ruby.is-active { background: #e2e8f0; color: #1e293b; }
        [data-theme="dark"] ruby:hover, [data-theme="dark"] ruby.is-active { background: #1e293b; color: #f1f5f9; }

        /* 🔤 拼音三态控制（悬停显示 / 全局显示 / 完全隐藏） */
        #content rt {
            opacity: 0;
            transition: opacity 0.2s ease;
            user-select: none;
            font-size: 12.5px;
            color: var(--ruby-color);
            font-weight: 700;
            padding-bottom: 6px;
        }
        #content ruby:hover rt, #content ruby.is-active rt { opacity: 1; }
        #content[data-pinyin-mode="show"] rt { opacity: 1 !important; }
        #content[data-pinyin-mode="hide"] rt { opacity: 0 !important; }

        /* 气泡弹窗 */
        .buddy-popover {
            display: none;
            position: fixed;
            z-index: 9999;
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            padding: 20px;
            width: 290px;
            box-sizing: border-box;
            border: 2px solid var(--primary-color);
            animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .pop-title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--input-border); padding-bottom: 10px; }
        .pop-title { font-size: 24px; font-weight: 800; font-family: "KaiTi", serif; }
        .pop-pinyin { font-size: 14px; color: var(--ruby-color); font-weight: 800; }
        .pop-box { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin-bottom: 10px; line-height: 1.5; font-weight: 600; }
        .pop-tag { font-size: 11px; font-weight: 800; color: white; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; background: var(--primary-color); }
        .pop-en { color: var(--primary-color); } .pop-en .pop-tag { background: var(--primary-color); }
        .pop-bm { color: var(--text-muted); } .pop-bm .pop-tag { background: var(--text-muted); }
        .pop-footer { display: flex; justify-content: flex-end; margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--input-border); }
        .pop-btn-copy { background: var(--primary-color); color: white; border: none; padding: 6px 16px; border-radius: var(--radius-md); font-size: 13px; cursor: pointer; font-weight: 800; transition: opacity 0.2s; }
        .pop-btn-copy:hover { opacity: 0.9; }
        .pop-arrow { position: absolute; bottom: -8px; left: 50%; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 8px solid var(--card-bg); transform: translateX(-50%); }

        /* 🔘 客观选择题选项按钮样式 */
        .quiz-choice-btn { 
            background: var(--card-bg) !important; 
            color: var(--text-color) !important; 
            border: 1px solid var(--input-border) !important; 
            font-weight: 600; 
            transition: all 0.15s ease !important; 
        }
        .quiz-choice-btn:hover {
            background: var(--accent-bg) !important;
            border-color: var(--primary-color) !important;
            color: var(--primary-color) !important;
            transform: translateY(-1px);
        }
        .quiz-choice-btn.selected { 
            background: var(--accent-bg) !important; 
            border: 2px solid var(--primary-color) !important; 
            color: var(--primary-color) !important; 
            font-weight: 800 !important; 
        }
        .quiz-choice-btn.correct-answer-hint { 
            background: var(--primary-color) !important; 
            border: 2px solid var(--primary-color) !important; 
            color: white !important; 
            font-weight: 800 !important; 
        }

        /* 简答题文本框样式 */
        .essay-textarea {
            width: 100%;
            height: 85px;
            padding: 12px;
            border-radius: var(--radius-md);
            border: 2px solid var(--input-border);
            background: var(--card-bg);
            color: var(--text-color);
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 500;
            resize: vertical;
            box-sizing: border-box;
            margin-top: 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .essay-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(51, 65, 85, 0.15);
        }

        /* 简答题参考答案容器 */
        .essay-answer-box {
            display: none;
            margin-top: 10px;
            padding: 14px;
            background: var(--accent-bg);
            border-left: 4px solid var(--primary-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            line-height: 1.7;
        }

        /* 📋 作答报告底部导出栏 */
        .report-action-bar {
            margin-top: 30px;
            padding: 18px 20px;
            background: var(--ai-bg);
            border: 1px dashed var(--input-border);
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        /* 🌟 文本赏析与考点解析（克莱因灰蓝学术风） */
        .teacher-p-analysis, [id^="q-analysis-"], [id^="essay-analysis-"] {
            background: var(--ai-bg) !important;
            border-left: 4px solid var(--ai-color) !important;
            color: var(--ai-color) !important;
            padding: 14px 18px;
            margin: 12px 0 22px 0;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            border: 1px solid var(--input-border);
        }
        [data-theme="dark"] .teacher-p-analysis, [data-theme="dark"] [id^="q-analysis-"], [data-theme="dark"] [id^="essay-analysis-"] {
            color: #cbd5e1 !important;
        }

        #teacherArticleAnalysis {
            background: var(--ai-bg) !important;
            border-left: 4px solid var(--ai-color) !important;
            color: var(--ai-color) !important;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: var(--radius-md);
            font-weight: 700;
            border: 1px solid var(--input-border);
        }
        [data-theme="dark"] #teacherArticleAnalysis {
            color: #cbd5e1 !important;
        }

        @media (max-width: 1024px) {
            .workspace-layout { grid-template-columns: 1fr; }
            .article-card, .quiz-side-card { max-height: none; }
        }

        /* ==========================================================================
           🖨️ 专属打印与 PDF 导出优化样式 (@media print)
           ========================================================================== */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .control-panel,
            .notebook-actions,
            #gameContainer,
            #buddyPopover,
            #submitQuizBtn,
            #retryQuizBtn,
            #showCorrectBtn,
            .report-action-bar,
            .no-print {
                display: none !important;
            }
            .top-container {
                margin-bottom: 15px !important;
            }
            .vocab-notebook {
                box-shadow: none !important;
                border: 1px solid #94a3b8 !important;
                padding: 12px 16px !important;
                page-break-inside: avoid;
            }
            .workspace-layout {
                display: block !important;
                width: 100% !important;
            }
            .article-card,
            .quiz-side-card {
                max-height: none !important;
                overflow: visible !important;
                box-shadow: none !important;
                border: none !important;
                padding: 10px 0 10px 55px !important;
                background: #ffffff !important;
                width: 100% !important;
            }
            .quiz-side-card {
                padding-left: 0 !important;
                margin-top: 25px !important;
                border-top: 2px solid #334155 !important;
                padding-top: 20px !important;
            }
            .quiz-choice-btn {
                border: 1px solid #94a3b8 !important;
                page-break-inside: avoid;
            }
            .essay-textarea {
                border: 1px solid #64748b !important;
                min-height: 90px !important;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <!-- 顶栏操作区 -->
    <div id="topContainer" class="top-container">
        <div class="control-panel">
            <button id="themeToggleBtn" onclick="toggleTheme()">🌓 切换主题</button>
            <button id="pinyinToggleBtn" onclick="togglePinyinMode()">🔤 拼音：悬停</button>
            <button id="gameToggleBtn" onclick="toggleGameMode()">🎯 生词测试</button>
            <button id="teacherToggleBtn" onclick="toggleTeacherMode()" style="background: var(--primary-color); color: #fff; border: none;">👁️ 文本赏析</button>
            <button id="focusToggleBtn" onclick="toggleFocusMode()" style="background: #475569; color: #fff; border: none;">📖 专注模式</button>
            <button id="topReportBtn" onclick="generateStudyReport(this)">📋 复制学习报告</button>
            <button onclick="window.print()">🖨️ 打印 / PDF</button>
        </div>

        <div id="vocabNotebookCard" class="vocab-notebook">
            <div class="notebook-title">
                <span>📖 我的生词本</span>
                <div class="notebook-actions">
                    <button id="exportNbBtn" class="export-nb-btn" onclick="exportNotebook(this)">导出词表 📋</button>
                    <button class="clear-btn" onclick="forceClearNotebook()">清空本子 🗑️</button>
                </div>
            </div>
            <div id="notebookList" class="notebook-list"></div>
        </div>
    </div>

    <!-- 生词测试全屏浮层 -->
    <div id="gameContainer" class="game-container" style="display: none;">
        <div class="quiz-card">
            <div id="quizProgress" style="font-size: 14px; color: var(--text-muted); margin-bottom: 8px; font-weight: 700;"></div>
            <div id="quizQuestion" class="quiz-question"></div>
            <div id="quizPinyin" class="quiz-pinyin"></div>
            <div id="quizOptions" class="quiz-options"></div>
        </div>
    </div>

    <!-- 左右双栏主工作区 -->
    <div class="workspace-layout">
        <!-- 左侧：课文与总览赏析 -->
        <div class="article-card">
            <h1 id="articleTitle">课文加载中...</h1>
            <div id="teacherArticleAnalysis" style="display: none; position: relative;">
                <div id="teacherArticleAnalysisContent"></div>
            </div>
            <div id="content" data-pinyin-mode="hover"></div>
        </div>

        <!-- 右侧：客观题及简答题区 -->
        <div id="quizSection" class="quiz-side-card">
            <h2 style="font-size: 20px; margin-bottom: 20px; border-bottom: 2px dashed var(--input-border); padding-bottom: 10px;">📝 一、选择题（客观题）</h2>
            <div id="quizContainer"></div>

            <div class="no-print" style="margin-top: 25px; padding-top: 15px; border-top: 2px solid var(--input-border); text-align: center;">
                <button id="submitQuizBtn" onclick="submitAndShowWrongOnly()" style="padding: 12px 32px; background: var(--primary-color); color: white; border: none; border-radius: 25px; font-size: 15px; font-weight: 800; cursor: pointer; transition: opacity 0.2s;">
                    提交客观题检查 🚀
                </button>
                <button id="retryQuizBtn" onclick="retryQuizAnswers()" style="display: none; padding: 12px 32px; background: var(--text-muted); color: white; border: none; border-radius: 25px; font-size: 15px; font-weight: 800; cursor: pointer; margin-right: 10px;">
                    重新作答 🔄
                </button>
                <button id="showCorrectBtn" onclick="revealRealCorrectAnswers()" style="display: none; padding: 12px 32px; background: var(--primary-color); color: white; border: none; border-radius: 25px; font-size: 15px; font-weight: 800; cursor: pointer;">
                    查看客观题答案 👁️
                </button>

    <!-- ⚙️ 阅读器核心逻辑控制大脑 -->
    <script>
        let currentIdx = -1; 
        let saved = JSON.parse(localStorage.getItem('saved_104')) || [];
        let quizData = [];
        let currentQuizIdx = 0;
        let isLocked = false;
        let isTeacherMode = false;
        let isFocusMode = false;
        let pinyinMode = 'hover'; // 'hover' | 'show' | 'hide'
        let isQuizSubmitted = false;
        let userSelectedAnswers = {};

        window.onload = function() {
            if (typeof lessonTitle !== 'undefined') {
                document.getElementById('articleTitle').innerText = lessonTitle;
                document.title = lessonTitle;
            }

            if (typeof lessonData !== 'undefined') { 
                render(); 
                renderNB(); 
            }

            renderMultipleChoiceQuizzes();
            renderEssayQuizzes();
            
            document.body.appendChild(document.getElementById('buddyPopover'));
            document.addEventListener('click', () => { 
                document.getElementById('buddyPopover').style.display = 'none'; 
                document.querySelectorAll('ruby').forEach(r => r.classList.remove('is-active'));
            });
        };

        /* 📋 通用剪贴板复制工具（兼容本地 file:// 协议与现代浏览器） */
        function copyTextToClipboard(text, btnElement, successLabel) {
            const originalText = btnElement ? btnElement.innerText : "";
            const showSuccess = () => {
                if (btnElement) {
                    btnElement.innerText = successLabel || "✓ 已复制";
                    setTimeout(() => { btnElement.innerText = originalText; }, 1800);
                }
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showSuccess).catch(() => fallbackCopy(text, showSuccess));
            } else {
                fallbackCopy(text, showSuccess);
            }
        }

        function fallbackCopy(text, callback) {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
                document.execCommand('copy');
                if (callback) callback();
            } catch (err) {
                alert("复制失败，请手动全选复制。");
            }
            document.body.removeChild(ta);
        }

        /* 🔤 1. 拼音三态切换逻辑 */
        function togglePinyinMode() {
            const cnt = document.getElementById('content');
            const btn = document.getElementById('pinyinToggleBtn');
            if (pinyinMode === 'hover') {
                pinyinMode = 'show';
                cnt.setAttribute('data-pinyin-mode', 'show');
                btn.innerText = '🔤 拼音：全显';
            } else if (pinyinMode === 'show') {
                pinyinMode = 'hide';
                cnt.setAttribute('data-pinyin-mode', 'hide');
                btn.innerText = '🔤 拼音：隐藏';
            } else {
                pinyinMode = 'hover';
                cnt.setAttribute('data-pinyin-mode', 'hover');
                btn.innerText = '🔤 拼音：悬停';
            }
        }

        /* 📤 2. 生词本一键导出逻辑 */
        function exportNotebook(btnElement) {
            if (saved.length === 0) {
                alert("📖 生词本目前是空的哦！请先在正文中点击词语并点击 Copy 收集生词。");
                return;
            }
            const title = (typeof lessonTitle !== 'undefined') ? lessonTitle : document.getElementById('articleTitle').innerText;
            let lines = [`📖 《${title}》生词整理表（共 ${saved.length} 词）`, "========================================"];
            saved.forEach((idx, i) => {
                const item = lessonData[idx];
                if (item) {
                    lines.push(`${i + 1}. 【${item[0]}】 [${item[1]}]`);
                    lines.push(`   • EN: ${item[2]}`);
                    lines.push(`   • BM: ${item[3]}`);
                }
            });
            copyTextToClipboard(lines.join("\n"), btnElement, "✓ 词表已复制");
        }

        /* 📋 3. 一键生成作答报告逻辑 */
        function generateStudyReport(btnElement) {
            const title = (typeof lessonTitle !== 'undefined') ? lessonTitle : document.getElementById('articleTitle').innerText;
            const nowStr = new Date().toLocaleString('zh-CN', { hour12: false });
            let report = [];

            report.push(`📄 《${title}》学习作答报告`);
            report.push(`生成时间：${nowStr}`);
            report.push(`========================================\n`);

            // 一、客观题部分
            report.push(`【一、客观选择题】`);
            if (typeof quizDataList !== 'undefined' && quizDataList.length > 0) {
                let correctCount = 0;
                const totalQ = quizDataList.length;
                const answeredQ = Object.keys(userSelectedAnswers).length;

                quizDataList.forEach(q => {
                    const chosen = userSelectedAnswers[q.id];
                    if (chosen) {
                        const letter = chosen.trim().charAt(0);
                        const isRight = (letter === q.answer);
                        if (isRight) correctCount++;
                        const statusTag = isQuizSubmitted ? (isRight ? "✅ 正确" : `❌ 待订正`) : "已作答";
                        report.push(`${q.id}. ${q.question.replace(/\n/g, ' ')}`);
                        report.push(`   👉 我的选择：${chosen} 【${statusTag}】`);
                    } else {
                        report.push(`${q.id}. ${q.question.replace(/\n/g, ' ')}`);
                        report.push(`   👉 我的选择：（未作答）`);
                    }
                });
                if (isQuizSubmitted) {
                    report.push(`\n📊 客观题总分：${correctCount} / ${totalQ} 分\n`);
                } else {
                    report.push(`\n📊 客观题进度：已答 ${answeredQ} / ${totalQ} 题（尚未点击提交检查）\n`);
                }
            } else {
                report.push(`暂无客观题数据\n`);
            }

            // 二、主观简答题部分
            report.push(`【二、主观简答题】`);
            if (typeof essayDataList !== 'undefined' && essayDataList.length > 0) {
                essayDataList.forEach(essay => {
                    const draft = (localStorage.getItem(`essay_draft_${essay.id}`) || "").trim();
                    report.push(`${essay.question}`);
                    report.push(`   ✍️ 我的作答：${draft ? draft : "（未填写）"}\n`);
                });
            } else {
                report.push(`暂无简答题数据\n`);
            }

            // 三、生词本收集记录
            report.push(`【三、我的生词本记录（共 ${saved.length} 词）】`);
            if (saved.length > 0 && typeof lessonData !== 'undefined') {
                const words = saved.map(idx => lessonData[idx] ? `${lessonData[idx][0]} [${lessonData[idx][1]}]` : "").filter(Boolean);
                report.push(words.join(" ｜ "));
            } else {
                report.push(`暂未收集生词`);
            }

            copyTextToClipboard(report.join("\n"), btnElement, "✓ 报告已复制！");
        }

        function toggleFocusMode() {
            isFocusMode = !isFocusMode;
            const focusBtn = document.getElementById('focusToggleBtn');
            const notebookCard = document.getElementById('vocabNotebookCard');
            const articleCard = document.querySelector('.article-card');
            const quizSideCard = document.querySelector('.quiz-side-card');

            if (isFocusMode) {
                focusBtn.innerText = "🖥️ 退出专注";
                notebookCard.style.opacity = "0";
                notebookCard.style.transform = "translateY(-10px)";
                setTimeout(() => { notebookCard.style.display = "none"; }, 250);

                if (articleCard) articleCard.style.maxHeight = "88vh";
                if (quizSideCard && quizSideCard.style.display === "block") quizSideCard.style.maxHeight = "88vh";
            } else {
                focusBtn.innerText = "📖 专注模式";
                notebookCard.style.display = "block";
                setTimeout(() => {
                    notebookCard.style.opacity = "1";
                    notebookCard.style.transform = "translateY(0)";
                }, 10);

                if (articleCard) articleCard.style.maxHeight = "82vh";
                if (quizSideCard && quizSideCard.style.display === "block") quizSideCard.style.maxHeight = "82vh";
            }
        }

        function render() {
            const cnt = document.getElementById('content'); 
            if (!cnt) return;
            cnt.innerHTML = "";
            let pNum = 1; 
            let p = document.createElement("p"); 
            
            const topAnalysis = document.getElementById('teacherArticleAnalysis');
            const topAnalysisContent = document.getElementById('teacherArticleAnalysisContent');
            if (topAnalysis && topAnalysisContent) {
                if (isTeacherMode && typeof lessonTeacherAnalysis !== 'undefined' && lessonTeacherAnalysis.overview) {
                    topAnalysis.style.display = "block";
                    topAnalysisContent.innerHTML = `<strong>💡 课文总览与赏析要点：</strong><br>${lessonTeacherAnalysis.overview}`;
                } else {
                    topAnalysis.style.display = "none";
                }
            }

            function finalizeParagraph(paragraphElement) {
                if (paragraphElement.childNodes.length === 0) return;
                const textContent = paragraphElement.innerText.trim();
                const isAuthorLineAtEnd = (textContent.startsWith("（") && textContent.includes("《"));
                
                if (isAuthorLineAtEnd) {
                    paragraphElement.style.textIndent = "0";
                    paragraphElement.style.textAlign = "right";  
                    paragraphElement.style.color = "var(--text-muted)";    
                    paragraphElement.style.fontSize = "15px";     
                    paragraphElement.style.marginTop = "30px";    
                    cnt.appendChild(paragraphElement);
                } else {
                    paragraphElement.style.position = "relative";
                    paragraphElement.style.textIndent = "2em"; 
                    paragraphElement.style.paddingLeft = "0"; 
                    paragraphElement.style.marginBottom = "25px";
                    
                    let s = document.createElement("span");
                    s.className = "p-index";
                    s.innerText = `第${pNum}段`;
                    s.style.position = "absolute";
                    s.style.left = "-55px"; 
                    s.style.top = "4px"; 
                    s.style.textIndent = "0"; 
                    
                    paragraphElement.insertBefore(s, paragraphElement.firstChild); 
                    cnt.appendChild(paragraphElement);

                    if (typeof lessonTeacherAnalysis !== 'undefined' && lessonTeacherAnalysis.paragraphs && lessonTeacherAnalysis.paragraphs[pNum]) {
                        let pAnalysis = document.createElement("div");
                        pAnalysis.id = `p-analysis-${pNum}`;
                        pAnalysis.className = "teacher-p-analysis";
                        pAnalysis.style.textIndent = "0";
                        pAnalysis.innerHTML = `<strong>🔍 第 ${pNum} 段文本赏析：</strong>${lessonTeacherAnalysis.paragraphs[pNum]}`;
                        
                        pAnalysis.style.display = isTeacherMode ? "block" : "none";
                        cnt.appendChild(pAnalysis);
                    }
                    pNum++; 
                }
            }

            if (typeof lessonData !== 'undefined') {
                lessonData.forEach((d, i) => {
                    if (d[0] === "\n") { finalizeParagraph(p); p = document.createElement("p"); }
                    else if (d[1] === "") { let s = document.createElement("span"); s.innerText = d[0]; p.appendChild(s); }
                    else {
                        let r = document.createElement("ruby"); 
                        r.setAttribute("data-word-index", i);
                        r.onclick = (e) => { 
                            e.stopPropagation(); 
                            document.querySelectorAll('ruby').forEach(x=>x.classList.remove('is-active')); 
                            r.classList.add('is-active'); 
                            openPop(e.currentTarget, i);
                        };
                        r.innerHTML = `${d[0]}<rt>${d[1]}</rt>`; 
                        p.appendChild(r);
                    }
                });
                finalizeParagraph(p);
            }
        }

        function renderMultipleChoiceQuizzes() {
            const section = document.getElementById('quizSection');
            const container = document.getElementById('quizContainer');
            if (!container) return;
            section.style.display = "block";
            container.innerHTML = "";
            
            if (typeof quizDataList === 'undefined' || quizDataList.length === 0) {
                container.innerHTML = "<p style='color:var(--text-muted);'>暂无选择题数据</p>";
                return;
            }

            userSelectedAnswers = {};
            isQuizSubmitted = false;
            document.getElementById('quizResultScore').style.display = "none";
            document.getElementById('submitQuizBtn').style.display = "inline-block";
            document.getElementById('submitQuizBtn').disabled = false;
            document.getElementById('submitQuizBtn').innerText = "提交客观题检查 🚀";
            document.getElementById('retryQuizBtn').style.display = "none";
            document.getElementById('showCorrectBtn').style.display = "none";

            quizDataList.forEach((q) => {
                const qBox = document.createElement('div');
                qBox.style.marginBottom = "22px";
                qBox.style.paddingBottom = "18px";
                qBox.style.borderBottom = "1px dashed var(--input-border)";
                qBox.setAttribute("data-q-id", q.id);

                const qText = document.createElement('div');
                qText.style.fontWeight = "800";
                qText.style.fontSize = "15.5px";
                qText.style.marginBottom = "10px";
                qText.innerHTML = `${q.id}. ${q.question.replace(/\n/g, '<br>')}`;
                qBox.appendChild(qText);

                if (q.teacherAnalysis) {
                    let qAnalysis = document.createElement("div");
                    qAnalysis.id = `q-analysis-${q.id}`;
                    qAnalysis.innerHTML = `<strong>📐 设题意图与核心考点：</strong>${q.teacherAnalysis}`;
                    qAnalysis.style.display = isTeacherMode ? "block" : "none";
                    qBox.appendChild(qAnalysis);
                }

                const oBox = document.createElement('div');
                oBox.className = "options-group";
                
                let pureContents = q.options.map(opt => opt.replace(/^[A-D]\s+/, ""));
                let shuffledContents = [...pureContents].sort(() => Math.random() - 0.5);
                const prefixes = ["A", "B", "C", "D"];

                shuffledContents.forEach((content, index) => {
                    const prefix = prefixes[index];
                    const finalOptText = `${prefix} ${content}`;
                    const btn = document.createElement('button');
                    btn.innerText = finalOptText;
                    btn.className = "quiz-choice-btn";
                    
                    const originalMatch = q.options.find(o => o.replace(/^[A-D]\s+/, "") === content);
                    btn.setAttribute("data-original-text", originalMatch || finalOptText);

                    btn.style.display = "block";
                    btn.style.width = "100%";
                    btn.style.textAlign = "left";
                    btn.style.margin = "6px 0";
                    btn.style.padding = "10px 14px";
                    btn.style.borderRadius = "var(--radius-md)";
                    btn.style.cursor = "pointer";
                    btn.style.fontSize = "14.5px";

                    btn.onclick = () => {
                        if (btn.disabled) return;
                        Array.from(oBox.children).forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        userSelectedAnswers[q.id] = originalMatch || finalOptText;
                    };
                    oBox.appendChild(btn);
                });

                qBox.appendChild(oBox);
                container.appendChild(qBox);
            });
        }

        function renderEssayQuizzes() {
            const container = document.getElementById('essayContainer');
            if (!container) return;
            container.innerHTML = "";

            if (typeof essayDataList === 'undefined' || essayDataList.length === 0) {
                container.innerHTML = "<p style='color:var(--text-muted); font-size:13px;'>暂无简答题数据</p>";
                return;
            }

            essayDataList.forEach((essay) => {
                const eBox = document.createElement('div');
                eBox.style.marginBottom = "25px";
                eBox.style.paddingBottom = "18px";
                eBox.style.borderBottom = "1px dashed var(--input-border)";
                eBox.setAttribute("data-essay-id", essay.id);

                const eText = document.createElement('div');
                eText.style.fontWeight = "800";
                eText.style.fontSize = "15.5px";
                eText.style.marginBottom = "10px";
                eText.innerHTML = `${essay.question}`;
                eBox.appendChild(eText);

                if (essay.teacherAnalysis) {
                    let eAnalysis = document.createElement("div");
                    eAnalysis.id = `essay-analysis-${essay.id}`;
                    eAnalysis.innerHTML = `<strong>📐 考点与答题思路：</strong>${essay.teacherAnalysis}`;
                    eAnalysis.style.display = isTeacherMode ? "block" : "none";
                    eBox.appendChild(eAnalysis);
                }

                const textarea = document.createElement('textarea');
                textarea.className = "essay-textarea";
                textarea.placeholder = "请在此输入您的解答思路（内容将自动实时保存在本地浏览器中）...";
                
                const storageKey = `essay_draft_${essay.id}`;
                const savedDraft = localStorage.getItem(storageKey);
                if (savedDraft) {
                    textarea.value = savedDraft;
                }

                textarea.oninput = () => {
                    localStorage.setItem(storageKey, textarea.value);
                };

                eBox.appendChild(textarea);

                const toggleAnswerBtn = document.createElement('button');
                toggleAnswerBtn.className = "no-print";
                toggleAnswerBtn.innerText = "👁️ 查看参考答案";
                toggleAnswerBtn.style.cssText = "margin-top: 10px; padding: 6px 14px; background: var(--primary-color); color: white; border: none; border-radius: 15px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: opacity 0.2s;";
                
                const answerBox = document.createElement('div');
                answerBox.className = "essay-answer-box";
                answerBox.innerHTML = `<strong>💡 参考答案：</strong><br>${essay.sampleAnswer}`;

                toggleAnswerBtn.onclick = () => {
                    if (answerBox.style.display === "block") {
                        answerBox.style.display = "none";
                        toggleAnswerBtn.innerText = "👁️ 查看参考答案";
                    } else {
                        answerBox.style.display = "block";
                        toggleAnswerBtn.innerText = "🔒 隐藏参考答案";
                    }
                };

                eBox.appendChild(toggleAnswerBtn);
                eBox.appendChild(answerBox);
                container.appendChild(eBox);
            });
        }

        function clearEssayDrafts() {
            if (confirm("⚠️ 确定要清空所有简答题的本地输入草稿吗？")) {
                if (typeof essayDataList !== 'undefined') {
                    essayDataList.forEach(essay => {
                        localStorage.removeItem(`essay_draft_${essay.id}`);
                    });
                }
                renderEssayQuizzes();
            }
        }

        function toggleTeacherMode() {
            isTeacherMode = !isTeacherMode;
            const btn = document.getElementById('teacherToggleBtn');
            btn.innerText = isTeacherMode ? "❌ 关闭文本赏析" : "👁️ 文本赏析";
            
            const topAnalysis = document.getElementById('teacherArticleAnalysis');
            const topAnalysisContent = document.getElementById('teacherArticleAnalysisContent');
            if (topAnalysis && topAnalysisContent) {
                if (isTeacherMode && typeof lessonTeacherAnalysis !== 'undefined' && lessonTeacherAnalysis.overview) {
                    topAnalysis.style.display = "block";
                    topAnalysisContent.innerHTML = `<strong>💡 课文总览与赏析要点：</strong><br>${lessonTeacherAnalysis.overview}`;
                } else {
                    topAnalysis.style.display = "none";
                }
            }

            document.querySelectorAll('.teacher-p-analysis').forEach(panel => {
                panel.style.display = isTeacherMode ? "block" : "none";
            });

            if (typeof quizDataList !== 'undefined') {
                quizDataList.forEach(q => {
                    const qPanel = document.getElementById(`q-analysis-${q.id}`);
                    if (qPanel) qPanel.style.display = isTeacherMode ? "block" : "none";
                });
            }

            if (typeof essayDataList !== 'undefined') {
                essayDataList.forEach(e => {
                    const ePanel = document.getElementById(`essay-analysis-${e.id}`);
                    if (ePanel) ePanel.style.display = isTeacherMode ? "block" : "none";
                });
            }
        }

        function submitAndShowWrongOnly() {
            const totalQuestions = quizDataList.length;
            const answeredCount = Object.keys(userSelectedAnswers).length;

            if (answeredCount < totalQuestions) {
                alert(`⚠️ 客观选择题还有未填完的哦！已完成 (${answeredCount} / ${totalQuestions}) 题。`);
                return;
            }

            let score = 0;
            isQuizSubmitted = true;

            quizDataList.forEach(q => {
                const qBox = document.querySelector(`div[data-q-id="${q.id}"]`);
                const buttons = qBox.querySelectorAll('.quiz-choice-btn');
                const studentOriginalText = userSelectedAnswers[q.id];

                let selectedBtn = null;
                buttons.forEach(btn => {
                    if (btn.getAttribute("data-original-text") === studentOriginalText) selectedBtn = btn;
                });

                const studentLetter = studentOriginalText.trim().charAt(0);
                buttons.forEach(btn => {
                    btn.disabled = true; 
                    btn.style.boxShadow = "none";

                    if (btn === selectedBtn && studentLetter === q.answer) {
                        if (!btn.innerText.includes("  (✅)")) btn.innerText += "  (✅)";
                        btn.classList.add('correct-answer-hint');
                        btn.style.fontWeight = "800";
                    }
                    if (btn === selectedBtn && studentLetter !== q.answer) {
                        btn.style.background = "#64748b";
                        btn.style.color = "white";
                        btn.style.borderColor = "#64748b";
                        if (!btn.innerText.includes("  (❌️)")) btn.innerText += "  (❌️)";
                    }
                });

                if (studentLetter === q.answer) score++;
            });

            const resultBox = document.getElementById('quizResultScore');
            resultBox.style.display = "block";
            resultBox.innerHTML = `🎉 客观题得分：<span style="font-size: 22px; color: var(--accent-color); font-weight: 800;">${score}</span> / ${totalQuestions} 分`;
            
            document.getElementById('submitQuizBtn').style.display = "none";
            document.getElementById('retryQuizBtn').style.display = "inline-block";
            document.getElementById('showCorrectBtn').style.display = "inline-block";
        }

        function retryQuizAnswers() {
            renderMultipleChoiceQuizzes();
            renderEssayQuizzes();
            document.getElementById('quizResultScore').style.display = "none";
            document.getElementById('retryQuizBtn').style.display = "none";
            document.getElementById('showCorrectBtn').style.display = "none";
            document.getElementById('submitQuizBtn').style.display = "inline-block";
        }

        function revealRealCorrectAnswers() {
            quizDataList.forEach(q => {
                const qBox = document.querySelector(`div[data-q-id="${q.id}"]`);
                qBox.querySelectorAll('.quiz-choice-btn').forEach(btn => {
                    const btnOriginalText = btn.getAttribute("data-original-text");
                    const btnLetter = btnOriginalText ? btnOriginalText.trim().charAt(0) : btn.innerText.trim().charAt(0); 

                    if (btnLetter === q.answer) {
                        let currentText = btn.innerText.replace("  (✅)", "").replace(" (✅)", "");
                        btn.innerText = currentText + "  (✅)";
                        btn.style.fontWeight = "800";
                        btn.classList.add('correct-answer-hint');
                    }
                });
            });
            document.getElementById('showCorrectBtn').style.display = "none";
        }

        function openPop(el, i) {
            currentIdx = i; const d = lessonData[i];
            document.getElementById('popWord').innerText = d[0];
            document.getElementById('popPinyin').innerText = `[${d[1]}]`;
            document.getElementById('popEn').innerText = d[2]; 
            document.getElementById('popBm').innerText = d[3];
            
            const pop = document.getElementById('buddyPopover'); 
            const arrow = document.getElementById('popArrow');
            pop.style.display = 'block'; 
            
            const rect = el.getBoundingClientRect(); 
            const popRect = pop.getBoundingClientRect();
            
            let top = rect.top - popRect.height - 15; 
            let left = rect.left + (rect.width / 2) - (popRect.width / 2);
            
            if (left + popRect.width > window.innerWidth - 15) left = window.innerWidth - popRect.width - 15;
            if (left < 15) left = 15;
            
            arrow.style.left = `${(rect.left + rect.width / 2) - left}px`; 
            pop.style.top = `${top}px`; 
            pop.style.left = `${left}px`;
        }

        function saveToNotebook(e) { 
            e.stopPropagation(); 
            if (!saved.includes(currentIdx)) { 
                saved.push(currentIdx); 
                localStorage.setItem('saved_104', JSON.stringify(saved)); 
                renderNB(); 
            } 
            const btn = e.target; 
            btn.innerText = "✓ 已存"; 
            setTimeout(() => btn.innerText = "Copy 📋", 1000); 
        }

        function renderNB() { 
            const list = document.getElementById('notebookList'); 
            if (!list) return;
            if (saved.length === 0) { 
                list.innerHTML = "<span style='color:var(--text-muted); font-size:13.5px;'>点击正文词语 Copy 记录生词</span>"; 
            } else { 
                list.innerHTML = ""; 
                saved.forEach(idx => { 
                    const item = lessonData[idx]; 
                    if(!item) return; 
                    
                    const div = document.createElement("div"); 
                    div.className = "notebook-item"; 
                    div.style.display = "inline-flex";
                    div.style.alignItems = "center";
                    div.style.gap = "6px";
                    div.style.cursor = "pointer";

                    const textSpan = document.createElement("span");
                    textSpan.innerText = item[0];
                    textSpan.onclick = (e) => { 
                        e.stopPropagation(); 
                        const target = document.querySelector(`ruby[data-word-index="${idx}"]`); 
                        if(target) { 
                            target.scrollIntoView({behavior: "smooth", block: "center"}); 
                            document.querySelectorAll('ruby').forEach(r => r.classList.remove('is-active')); 
                            setTimeout(() => { 
                                target.classList.add('is-active'); 
                                openPop(target, idx); 
                            }, 500); 
                        } 
                    }; 
                    div.appendChild(textSpan);

                    const deleteBtn = document.createElement("span");
                    deleteBtn.innerText = "×";
                    deleteBtn.style.color = "var(--text-muted)";
                    deleteBtn.style.fontWeight = "bold";
                    deleteBtn.style.padding = "0 4px";
                    deleteBtn.style.cursor = "pointer";
                    deleteBtn.onclick = (e) => { e.stopPropagation(); removeSingleWordFromNotebook(idx); };
                    div.appendChild(deleteBtn);

                    list.appendChild(div); 
                }); 
            } 
        }

        function removeSingleWordFromNotebook(idx) {
            saved = saved.filter(savedIdx => savedIdx !== idx);
            localStorage.setItem('saved_104', JSON.stringify(saved)); 
            renderNB(); 
            if (saved.length === 0) {
                document.getElementById('gameContainer').style.display = 'none'; 
                document.getElementById('gameToggleBtn').innerText = "🎯 生词测试";
            }
        }

        function forceClearNotebook() { 
            localStorage.removeItem('saved_104'); 
            saved = []; 
            renderNB(); 
            document.getElementById('gameContainer').style.display = 'none'; 
            document.getElementById('gameToggleBtn').innerText = "🎯 生词测试"; 
        }

        function toggleGameMode() { 
            const container = document.getElementById('gameContainer'); 
            const btn = document.getElementById('gameToggleBtn'); 
            if (container.style.display === 'block') { 
                container.style.display = 'none'; 
                btn.innerText = "🎯 生词测试"; 
            } else { 
                if (saved.length < 1) { 
                    alert("生词本是空的哦！要先在正文里点生词进行 Copy 收集！"); 
                    return; 
                } 
                container.style.display = 'block'; 
                btn.innerText = "📖 返回课文"; 
                startQuizGame(); 
                container.scrollIntoView({behavior: "smooth"}); 
            } 
        }

        function startQuizGame() { 
            quizData = [...saved].sort(() => Math.random() - 0.5); 
            currentQuizIdx = 0; 
            loadQuestion(); 
        }

        function loadQuestion() { 
            isLocked = false; 
            const targetIdx = quizData[currentQuizIdx]; 
            const data = lessonData[targetIdx]; 
            document.getElementById('quizProgress').innerText = `第 ${currentQuizIdx + 1} / ${quizData.length} 题`; 
            document.getElementById('quizQuestion').innerText = data[0]; 
            document.getElementById('quizPinyin').innerText = `[${data[1]}]`; 
            
            const correctStr = (data[2].trim() + "；" + data[3].trim()); 
            let options = [correctStr]; 
            let others = lessonData.filter(d => d[1] !== "" && d[0] !== data[0]).map(d => (d[2].trim() + "；" + d[3].trim())); 
            others = [...new Set(others)].filter(s => s !== correctStr).sort(() => Math.random() - 0.5); 
            
            for(let i=0; i<3; i++) { if(others[i]) options.push(others[i]); } 
            options.sort(() => Math.random() - 0.5); 
            
            const optDiv = document.getElementById('quizOptions'); 
            optDiv.innerHTML = ""; 
            options.forEach(opt => { 
                const b = document.createElement('button'); 
                b.className = 'quiz-opt-btn'; 
                b.innerText = opt; 
                b.onclick = () => { 
                    if(isLocked || b.classList.contains('wrong')) return; 
                    if(opt.trim() === correctStr.trim()) { 
                        isLocked = true; 
                        b.classList.add('correct'); 
                        setTimeout(() => { 
                            currentQuizIdx++; 
                            if(currentQuizIdx < quizData.length) loadQuestion(); 
                            else { alert("🎉 完成测试！你真棒！"); toggleGameMode(); } 
                        }, 800); 
                    } else { b.classList.add('wrong'); } 
                }; 
                optDiv.appendChild(b); 
            }); 
        }

        function toggleTheme() { 
            document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme')==='dark'?'':'dark'); 
        }
    </script>
</body>
</html>
